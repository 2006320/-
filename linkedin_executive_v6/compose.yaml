services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: executives
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d executives"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/executives
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/executives
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
